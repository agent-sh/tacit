<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>tacit</title>
  <!-- Facts your agents share: a small stack of fact cards on ink, the top
       one settled with the app's pencil-red check. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34362f"/>
      <stop offset="1" stop-color="#1c1d1a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f2ec"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="53.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="rotate(-9 128 132)">
    <rect x="66" y="52" width="132" height="112" rx="16" fill="#8d8f86"/>
  </g>
  <g transform="rotate(-4 128 132)">
    <rect x="62" y="62" width="136" height="116" rx="16" fill="#c9cbc2"/>
  </g>
  <g filter="url(#lift)">
    <rect x="56" y="76" width="144" height="120" rx="16" fill="url(#card)"/>
    <rect x="78" y="100" width="70" height="12" rx="6" fill="#1c1d1a"/>
    <rect x="78" y="126" width="100" height="8" rx="4" fill="#9a9c93"/>
    <rect x="78" y="144" width="80" height="8" rx="4" fill="#9a9c93"/>
  </g>
  <circle cx="184" cy="180" r="33" fill="#b3262c" stroke="#24261f" stroke-width="7"/>
  <path d="M168 181l11 11 21-23" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
