# Generic example. Copy to ignored config/local.yaml for private settings.
# Provider credentials stay in the selected CLI or the job environment file.
store: ~/.local/share/tacit/store
projects: ~/projects
index: ~/.local/state/tacit/index
keys: ~/.config/tacit
local_overlay: ~/.local/share/tacit/local
# on: a read-only clone dreams and curates its own sessions into the local overlay, never pushed.
local_layer: off
owner_names: []
# The flat MEMORY.md, for clients from before the folder indexes; on (default) keeps generating it.
# Turn it off only once every client reads the folder indexes; the setting goes away then.
# memory_md: on
# Hermes session store (read-only); default ~/.hermes/state.db when it exists, off for none.
# hermes_db: off
verify_roots: []
# Hook delivery; every switch defaults to on (README, Client settings).
delivery:
  repo_start: on
  repo_aliases: on
  prompt_metadata: on
  prompt_action: on
  instruction: on
  tool_push: on
  tree_pointer: on
  start_ceiling: 6
  prompt_ceiling: 5
  prompt_relative: 0.7
  meta_ceiling: 1
runner: claude
runners: {}
models:
  curate: opus
  judge: haiku
  dream: opus
  verify: opus
  # verify_fallback: sonnet # Legacy same-runner option; prefer fallbacks below.
efforts: {}
profiles: {}
timeouts: {}
# Extraction batch limit; 0 disables it. Model attempt timeouts still apply.
dream_max_runtime: 45m
commands: {}
runner_args: {}
fallbacks:
  curate: null
  judge: null
  dream: null
  verify:
    runner: claude
    model: sonnet
