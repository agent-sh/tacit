<svg xmlns="http://www.w3.org/2000/svg" width="880" height="476" viewBox="0 0 880 476" role="img" aria-labelledby="t d">
<title id="t">How tacit works</title>
<desc id="d">Agents send notes to collect, and a dreamer reads their transcripts; collect writes both to a git store; curate turns them into facts there; deliver gives matching facts back to agents through hooks and MCP, at session start and per prompt; check and organize maintain the store. All of it runs in the local client; an optional shared server syncs stores between machines, and then one machine curates the shared store.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d7f79"/></marker></defs>
<style>text{font-family:'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#e7e5de}.s{fill:#b0b0a8}.m{fill:#8f9089}</style>
<rect x="0.5" y="0.5" width="879" height="475" rx="8" fill="#1c1f24" stroke="#2b2f35"/>
<rect x="24" y="68" width="124" height="360" rx="6" fill="#23272d" stroke="#4a4e55"/>
<text x="40" y="196" font-size="15" font-weight="600">Agents</text>
<text class="s" x="40" y="220" font-size="13">Claude Code,</text>
<text class="s" x="40" y="238" font-size="13">Codex,</text>
<text class="s" x="40" y="256" font-size="13">Hermes,</text>
<text class="s" x="40" y="274" font-size="13">Grok, pi,</text>
<text class="s" x="40" y="292" font-size="13">Muse, agy</text>
<g transform="translate(-12,0)">
<rect x="200" y="24" width="500" height="428" rx="8" fill="#15171b" stroke="#4a4e55"/>
<text class="m" x="220" y="50" font-size="13" font-weight="600">Local client (Go)</text>
<rect x="220" y="68" width="210" height="104" rx="6" fill="#23272d" stroke="#2b2f35"/>
<circle cx="244" cy="92" r="10" fill="#6d8ff0"/>
<text x="244" y="96" font-size="13" font-weight="600" text-anchor="middle" style="fill:#15171b">1</text>
<text x="262" y="97" font-size="15" font-weight="600">Collect</text>
<text class="s" x="236" y="120" font-size="13">Inbox notes, imports,</text>
<text class="s" x="236" y="138" font-size="13">a dreamer that reads</text>
<text class="s" x="236" y="156" font-size="13">redacted transcripts</text>
<rect x="470" y="68" width="210" height="104" rx="6" fill="#23272d" stroke="#2b2f35"/>
<circle cx="494" cy="92" r="10" fill="#6d8ff0"/>
<text x="494" y="96" font-size="13" font-weight="600" text-anchor="middle" style="fill:#15171b">2</text>
<text x="512" y="97" font-size="15" font-weight="600">Curate</text>
<text class="s" x="486" y="120" font-size="13">One fact per file, with</text>
<text class="s" x="486" y="138" font-size="13">its source and scope;</text>
<text class="s" x="486" y="156" font-size="13">doubts go to review</text>
<rect x="220" y="208" width="460" height="64" rx="6" fill="#23272d" stroke="#2b2f35"/>
<text x="236" y="237" font-size="15" font-weight="600">Store</text>
<text class="s" x="236" y="260" font-size="13">A git repository: facts, inbox notes and their history</text>
<rect x="220" y="308" width="140" height="120" rx="6" fill="#23272d" stroke="#2b2f35"/>
<circle cx="244" cy="332" r="10" fill="#6d8ff0"/>
<text x="244" y="336" font-size="13" font-weight="600" text-anchor="middle" style="fill:#15171b">3</text>
<text x="262" y="337" font-size="15" font-weight="600">Deliver</text>
<text class="s" x="236" y="360" font-size="13">Local index;</text>
<text class="s" x="236" y="378" font-size="13">hooks and MCP:</text>
<text class="s" x="236" y="396" font-size="13">facts at start</text>
<text class="s" x="236" y="414" font-size="13">and per prompt</text>
<rect x="380" y="308" width="140" height="120" rx="6" fill="#23272d" stroke="#2b2f35"/>
<circle cx="404" cy="332" r="10" fill="#6d8ff0"/>
<text x="404" y="336" font-size="13" font-weight="600" text-anchor="middle" style="fill:#15171b">4</text>
<text x="422" y="337" font-size="15" font-weight="600">Check</text>
<text class="s" x="396" y="360" font-size="13">A verifier checks</text>
<text class="s" x="396" y="378" font-size="13">facts on code,</text>
<text class="s" x="396" y="396" font-size="13">git and docs;</text>
<text class="s" x="396" y="414" font-size="13">asks you the rest</text>
<rect x="540" y="308" width="140" height="120" rx="6" fill="#23272d" stroke="#2b2f35"/>
<circle cx="564" cy="332" r="10" fill="#6d8ff0"/>
<text x="564" y="336" font-size="13" font-weight="600" text-anchor="middle" style="fill:#15171b">5</text>
<text x="582" y="337" font-size="15" font-weight="600">Organize</text>
<text class="s" x="556" y="360" font-size="13">Folder records:</text>
<text class="s" x="556" y="378" font-size="13">what each is,</text>
<text class="s" x="556" y="396" font-size="13">its status,</text>
<text class="s" x="556" y="414" font-size="13">an overview</text>
<path d="M160,120 L220,120" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M325,172 L325,208" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M575,172 L575,208" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M290,272 L290,308" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M450,272 L450,308" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M610,272 L610,308" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M220,368 L160,368" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M680,240 L724,240" fill="none" stroke="#7d7f79" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text class="m" x="182" y="110" font-size="12" text-anchor="middle">notes</text>
<text class="m" x="182" y="358" font-size="12" text-anchor="middle">facts</text>
</g>
<rect x="712" y="160" width="144" height="164" rx="6" fill="#1c1f24" stroke="#7d7f79" stroke-dasharray="4 3"/>
<text x="728" y="186" font-size="15" font-weight="600">Shared server</text>
<text class="s" x="728" y="210" font-size="13">Optional (Elixir):</text>
<text class="s" x="728" y="228" font-size="13">git transport,</text>
<text class="s" x="728" y="246" font-size="13">signed writers,</text>
<text class="s" x="728" y="264" font-size="13">a change feed;</text>
<text class="s" x="728" y="282" font-size="13">the curator runs</text>
<text class="s" x="728" y="300" font-size="13">on one machine</text>
</svg>
