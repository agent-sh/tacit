# Generic example. Copy to ignored config/local.yaml for private settings.
# Provider credentials stay in the selected CLI or the job environment file.
store: ~/.local/share/tacit/store
projects: ~/projects
index: ~/.local/state/tacit/index
keys: ~/.config/tacit
local_overlay: ~/.local/share/tacit/local
# on: a read-only clone dreams and curates its own sessions into the local overlay, never pushed.
local_layer: off
owner_names: []
# Hermes session store (read-only); default ~/.hermes/state.db when it exists, off for none.
# hermes_db: off
verify_roots: []
runner: claude
runners: {}
models:
  curate: opus
  judge: haiku
  dream: opus
  verify: opus
  # verify_fallback: sonnet # Legacy same-runner option; prefer fallbacks below.
efforts: {}
profiles: {}
timeouts: {}
# Extraction batch limit; 0 disables it. Model attempt timeouts still apply.
dream_max_runtime: 45m
commands: {}
runner_args: {}
fallbacks:
  curate: null
  judge: null
  dream: null
  verify:
    runner: claude
    model: sonnet
